# @@SERVICE_NAME@@: Spring Boot app + Tailscale sidecar. Generated by windows-selfhost-kit.
#
# How it works:
#   - "tailscale" joins your tailnet as the machine "@@SERVICE_NAME@@" and owns the
#     network. Funnel (ts-serve.json) publishes the app to the internet at
#     https://@@SERVICE_NAME@@.<your-tailnet>.ts.net (HTTPS on port 443).
#   - "app" shares the sidecar's network (network_mode: service:tailscale), so
#     127.0.0.1:@@APP_PORT@@ inside the sidecar is the app.
#   - Deploys rebuild ONLY the app (scripts/deploy.sh -> "up -d --no-deps app"). The
#     sidecar and its state volume are never recreated, so the machine name, tailnet
#     IP and public URL stay the same.
#   - Settings and secrets come from .env (never committed). See .env.example.
#   - Start/stop with scripts/up.sh, scripts/status.sh, scripts/down.sh.
name: @@SERVICE_NAME@@

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: @@SERVICE_NAME@@-ts
    hostname: @@SERVICE_NAME@@
    environment:
      - TS_HOSTNAME=@@SERVICE_NAME@@
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_AUTH_ONCE=true              # the key is only needed for the very first login
      - TS_USERSPACE=false             # real tailnet interface: the app can reach 100.x peers
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_EXTRA_ARGS=--accept-dns=false
      - TS_ENABLE_HEALTH_CHECK=true    # /healthz returns 200 once the node has a tailnet IP
      - TS_LOCAL_ADDR_PORT=127.0.0.1:9002
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./ts-serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9002/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        JAVA_VERSION: "@@JAVA_VERSION@@"
        APP_UID: ${APP_UID:-1000}
        GIT_SHA: ${GIT_SHA:-dev}
    image: @@SERVICE_NAME@@-app:latest
    container_name: @@SERVICE_NAME@@
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
    environment:
      - SERVER_PORT=@@APP_PORT@@
      - SERVICE_NAME=@@SERVICE_NAME@@
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-}
      - JAVA_OPTS=${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
      # Database (tailnet-only Postgres stack). DB_HOST is the DB machine's 100.x IP.  #@@DB@@
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_HOST:-DB_HOST-not-set}:5432/${POSTGRES_DB:-app}  #@@DB@@
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-app}  #@@DB@@
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-}  #@@DB@@
      # Service-to-service mTLS (README Part G). Active when SPRING_PROFILES_ACTIVE includes mtls.  #@@MTLS@@
      - MTLS_PORT=@@MTLS_PORT@@  #@@MTLS@@
      - MTLS_CLIENT_AUTH=${MTLS_CLIENT_AUTH:-want}  #@@MTLS@@
      - MTLS_ALLOWED_CLIENTS=${MTLS_ALLOWED_CLIENTS:-}  #@@MTLS@@
      - MTLS_ONLY_PATHS=${MTLS_ONLY_PATHS:-/internal/}  #@@MTLS@@
    volumes:  #@@MTLS@@
      - ./certs:/certs:ro  #@@MTLS@@
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  tailscale-state:
