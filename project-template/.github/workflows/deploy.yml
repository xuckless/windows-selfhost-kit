# Test on GitHub's servers, then deploy on your own PC. Generated by windows-selfhost-kit.
#
#   test      runs on a GitHub-hosted Ubuntu machine: ./mvnw verify.
#   redeploy  runs on YOUR PC (the self-hosted runner inside WSL2, label "@@RUNNER_LABEL@@"):
#             moves the deploy clone ~/apps/<repo> to the tested commit, rebuilds ONLY
#             the app container (the Tailscale sidecar is left alone), checks
#             /actuator/health, and rolls back to the previous image if it fails.
#
# Safety: only use a self-hosted runner with a PRIVATE repo, and never add a
# pull_request trigger to the redeploy job.
name: local-redeploy

on:
  push:
    branches: [@@BRANCH@@]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '@@JAVA_VERSION@@'
          cache: maven
      - name: Build and test
        run: chmod +x mvnw && ./mvnw -B -ntp verify

  redeploy:
    needs: test
    if: github.ref == 'refs/heads/@@BRANCH@@'
    runs-on: [self-hosted, @@RUNNER_LABEL@@]
    timeout-minutes: 20
    concurrency:
      group: redeploy-${{ github.repository }}
      cancel-in-progress: false
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Move the deploy clone to the tested commit
        run: |
          set -euo pipefail
          D="$HOME/apps/${GITHUB_REPOSITORY#*/}"
          [ -d "$D/.git" ] || { echo "::error::No deploy clone at $D (README Part E)"; exit 1; }
          [ -f "$D/.env" ] || { echo "::error::$D/.env is missing (README Part E)"; exit 1; }
          echo "DEPLOY_DIR=$D" >> "$GITHUB_ENV"
          cd "$D"
          git fetch --no-tags --prune origin "$BRANCH"
          git reset --hard "$GITHUB_SHA"
          git log -1 --oneline

      - name: Rebuild the app container only
        run: cd "$DEPLOY_DIR" && GIT_SHA="$GITHUB_SHA" ./scripts/deploy.sh

      - name: Health check (rolls back on failure)
        run: |
          cd "$DEPLOY_DIR"
          if ! ./scripts/healthcheck.sh --timeout 180; then
            echo "::error::Health check failed. Rolling back to the previous image."
            ./scripts/deploy.sh --rollback
            exit 1
          fi

      - name: Show app logs
        if: failure() && env.DEPLOY_DIR != ''
        run: cd "$DEPLOY_DIR" && docker compose logs --no-color --tail=200 app
