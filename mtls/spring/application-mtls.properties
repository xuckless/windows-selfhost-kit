# windows-selfhost-kit: loaded only when the "mtls" Spring profile is active.
# The certificate files are mounted into the container at /certs (see mtls/install-certs.sh).
spring.ssl.bundle.pem.mtls.keystore.certificate=file:/certs/${SERVICE_NAME}.crt
spring.ssl.bundle.pem.mtls.keystore.private-key=file:/certs/${SERVICE_NAME}.key
spring.ssl.bundle.pem.mtls.truststore.certificate=file:/certs/ca.crt
