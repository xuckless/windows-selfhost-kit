# @@DB_SERVICE_NAME@@: private Postgres database + Tailscale sidecar. Generated by windows-selfhost-kit.
#
# NOT on the public internet: there is no Funnel here (Postgres is raw TCP). The
# sidecar puts the database on your tailnet as the machine "@@DB_SERVICE_NAME@@";
# postgres shares its network, so it is reachable at <100.x tailnet IP>:5432 from
# your apps. It is also published on 127.0.0.1:5432 for local tools (from Windows:
# localhost:5432). Start/stop with scripts/up.sh, scripts/status.sh, scripts/down.sh.
name: @@DB_SERVICE_NAME@@

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: @@DB_SERVICE_NAME@@-ts
    hostname: @@DB_SERVICE_NAME@@
    environment:
      - TS_HOSTNAME=@@DB_SERVICE_NAME@@
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_AUTH_ONCE=true
      - TS_USERSPACE=false
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--accept-dns=false
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:9002
    volumes:
      - tailscale-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    ports:
      - "127.0.0.1:5432:5432"   # local admin only; apps connect over the tailnet
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9002/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  postgres:
    # For Postgres 18+, mount the volume at /var/lib/postgresql instead (the data path changed).
    image: postgres:17-alpine
    container_name: @@DB_SERVICE_NAME@@
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-app}
      - POSTGRES_DB=${POSTGRES_DB:-app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}   # set with: scripts/env.sh secret POSTGRES_PASSWORD --generate
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro   # runs ONLY when the volume is brand new
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  tailscale-state:
  pgdata:
